
name: Build ZalithBoost 1.21.1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Buscar proyecto Gradle
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar ZalithBoost
        run: cd "$PROJECT_DIR" && gradle build

      - name: Guardar JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ZalithBoost-1.21.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
        
